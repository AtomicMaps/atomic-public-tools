repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1500"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-atomic-tools
        name: mypy (atomic_tools)
        entry: mypy --config-file .mypy.ini src/atomic_tools
        language: python
        additional_dependencies:
          - mypy==1.20.2
        pass_filenames: false
      - id: mypy-tests
        name: mypy (tests)
        entry: mypy --config-file .mypy.ini tests
        language: python
        additional_dependencies:
          - mypy==1.20.2
        pass_filenames: false
